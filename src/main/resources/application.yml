server:
  port: 8080

spring:
  application:
    name: car-detailing-booking
  datasource:
    url: jdbc:postgresql://localhost:5432/car_detailing
    username: ${DB_USERNAME:car_detailing_user}
    password: ${DB_PASSWORD:changeme}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-before-deploying-1234567890}
    expiration-minutes: 480
